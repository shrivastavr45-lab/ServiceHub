# Development environment: `cp .env.example .env && docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub
      POSTGRES_DB: servicehub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: deps }
    working_dir: /app/apps/api
    # migrate + idempotent seed, then start with auto-reload
    command: sh -c "node src/migrate.js && node src/seed.js && node --watch src/server.js"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://servicehub:servicehub@db:5432/servicehub
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Copy .env.example to .env first}
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_API_URL: http://localhost:4000
      UPLOAD_DIR: /data/uploads
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123!}
    ports: ["4000:4000"]
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: dev }
    environment:
      VITE_API_URL: http://localhost:4000
    ports: ["5173:5173"]
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    depends_on: [api]

volumes:
  pgdata:
  uploads:
